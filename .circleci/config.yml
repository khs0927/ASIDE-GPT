version: 2.1

orbs:
  node: circleci/node@7.1.0

jobs:
  verify:
    docker:
      - image: cimg/node:22.13
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Test
          command: npm test
      - run:
          name: Gemini provider registration contract (fixture only)
          command: npm run test:aside-registration
      - run:
          name: Validate skills
          command: npm run check:skills
      - run:
          name: Build
          command: npm run build

  browser:
    docker:
      - image: cimg/node:22.13-browsers
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Install the Chromium build pinned by playwright-core
          command: npx playwright-core install chromium
      - run:
          name: Gemini Web bridge against the fixture page
          command: npm run test:browser

workflows:
  ci:
    jobs:
      - verify
      - browser
